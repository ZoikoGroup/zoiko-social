name: Deploy API to VM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'Dockerfile.api'
      - 'pnpm-lock.yaml'
      - '.github/workflows/api-deploy-vm.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            cd ~/zoiko-social
            git pull origin main
            docker build -f Dockerfile.api -t zoiko-api:latest --build-arg GIT_SHA=$(git rev-parse --short HEAD) .
            docker stop zoiko-api || true
            docker rm zoiko-api || true
            docker run -d \
              --name zoiko-api \
              --restart unless-stopped \
              --network host \
              --env-file ~/zoiko-social/apps/api/.env \
              zoiko-api:latest
            sleep 5
            curl -sf http://127.0.0.1:4000/api/v1/health || exit 1
            echo "Deploy successful – $(curl -s http://127.0.0.1:4000/api/v1/health/version)"
