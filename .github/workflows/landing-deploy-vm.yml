name: Deploy Landing to VM

on:
  push:
    branches: [main]
    paths:
      - 'apps/landing/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/landing-deploy-vm.yml'
  workflow_dispatch:

# Shares a group with web-deploy-vm.yml on purpose: both deploys check out the
# same working tree (~/zoiko-social-frontend) and run `git pull` in it, so
# running them at once races on the ref lock — which is exactly how the
# 687c72a deploy failed: "cannot lock ref 'refs/remotes/origin/main'".
concurrency:
  group: frontend-vm-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Backstop: if SSH hangs rather than the command running long, the job
    # should fail in minutes rather than occupy a runner for six hours.
    timeout-minutes: 25
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        # appleboy/ssh-action kills the remote command after 10 minutes by
        # default, and nothing here set it. The build runs BEFORE the
        # container is swapped, so hitting it left production untouched and
        # simply never deployed — a silent no-op dressed as a red build.
        # the landing image is smaller, but shares the same default.
        timeout: 60s
        command_timeout: 20m
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            cd ~/zoiko-social-frontend
            git pull origin main
            cd apps/landing
            pnpm install --frozen-lockfile
            pnpm build
            pm2 restart zoiko-landing
            pm2 save
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:3001 > /dev/null; then
                echo "Health check passed after ${i} attempt(s)"
                break
              fi
              if [ "$i" -eq 15 ]; then
                echo "Health check failed after 15 attempts (30s)"
                exit 1
              fi
              sleep 2
            done
            echo "Landing deploy successful"
